<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            background-color: red;
            height:100px ;
            width: 100px;
            margin-bottom: 10px;
        }

        #box:hover{
            background-color: blue;
            color: white;
            text-align: center;

            border-radius: 50%;

            transition: 3s;
        }

        button:hover{
            background-color: orange;
            color: whitesmoke;
            padding: 10px;
            border: none;
            border-radius: 12px;
            width: 150px;
            transition: 2s;
        }
    </style>
</head>
<body>
    <div id="box">
         BOX
    </div>

    <button>Login</button>
</body>
</html>
