<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
      .product{
        display: grid;
        /* grid-template-columns: 200px 200px 400px ; */

         /* grid-template-columns: 1fr 1fr 1fr 2fr; */

         /* grid-template-columns: repeat(No of column, Size of Column); */

         /* grid-template-columns: repeat(3,1fr); */

           grid-template-columns: repeat(auto-fit, minmax(250px,1fr));

      }


    .box{
        border: 1px solid black;
        background-color: red;
        text-align: center;
        color: white;
    }
</style>
  
</head>
<body>
    <div class="product">
        <div class="box">Cake</div>
        <div class="box">Cake-Price</div>
        <div class="box">Cookes</div>
        <div class="box">Cookies -Price</div>
        <div class="box">Pastry</div>
        <div class="box">Pastty-Price</div>
        
    </div>
</body>
</html>
