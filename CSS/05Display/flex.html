<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .products{
        background-color: aqua;
        height: 100vh;

        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
       }


        .box{
            background-color: brown;
            height: 120px;
            width: 150px;
            color: white;
            border: 1px solid blue;
        }
    </style>
</head>
<body>
    <div class="products">
          <div class="box">Cake</div>
          <div class="box">Cookies</div>
          <div class="box">Pastry</div>
    </div>
</body>
</html>
