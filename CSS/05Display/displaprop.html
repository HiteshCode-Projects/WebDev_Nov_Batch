<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      p{
        color: red;
      }

      p.ex1{
        display: none;
      }

      p.ex2{
        display: block;
        background-color: bisque;
      }

      p.ex3{
        display: inline;
        background-color: blueviolet;
      }

</style>
</head>
<body>
    <div>
        This is Display None Prop , None Means Nothing
        <p class="ex1">Hello Display None</p>
    </div>

    <div>
        This is Display Block , Takes 100%width Space Act Like Div
        <p class="ex2">Hello Display  Block</p>
    </div>


    <div>
        This is Display Inline , Takes required amt of width Act like span
        <p class="ex3">Hello Display Inline</p>
    </div>
</body>
</html>
