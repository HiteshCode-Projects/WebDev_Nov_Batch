<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: skyblue;

            height: 150px;
            width: 250px;

            text-align: center;
            

            border: 1px solid black;
            border-radius: 12px;

            margin: 12px;

            padding: 12px;

            box-sizing: border-box;  

        }

        p{
            border-bottom: 2px solid red ;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
         <p>Toys</p>
    </div>


    <div class="box">
        <p>Books</p>
    </div>
</body>
</html>
