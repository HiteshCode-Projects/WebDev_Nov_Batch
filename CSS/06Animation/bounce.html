<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball{
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: red;

            animation-name: bounce;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }

        @keyframes bounce{
            
            0% {opacity: 1; background-color: red; transform: translateY(0);  }


            50% {opacity: 0.5; background-color: tomato; transform: translateY(200px); box-shadow: 2px 8px 2px black; }
           

            100% {opacity: 1; background-color: red; transform: translateY(0);}


        }
    </style>
</head>
<body>
    <div class="ball">

    </div>
</body>
</html>
