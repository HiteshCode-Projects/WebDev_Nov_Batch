<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
       
       //Operator - Action on Data

       //1.Arthmetic Operator : +  - , / , * , %(Reamainder)

       let x = 10
       let y = 3

        console.log(x+y)
        console.log(x-y)
        console.log(x/y)
        console.log(x*y)
        console.log(x%y)  //10%3 --- 1

        console.log(10%2) //0
        console.log(11%2) //1

                  //Left < Right --- Left Number
        console.log(1 % 3)   //1 
        console.log(2 % 9)   //2


        //2. Assignment Operator  = Value

        let score = 3

        score += 1

        console.log(score)

        //3. Realtional Operator- Comparsion - Boolean(true or false)
        let a = 20
        let b = 10

        console.log(a>b)  //20>10 - T

        console.log(a<b) //20 < 10  - F

        let p = 5
        let q = 5

        console.log(p>=q)  //5 >= 5 : T
        console.log(p<=q)  // 5 <=5 : T

        let num1 = 10  //number
        let num2 = "10" //String

        // == It will Only CHecks The VAULE

        console.log(num1 == num2)  //T


      // === It Will Check Value and Data type
        console.log(num1 === num2) // F


       let pqr = 5
       let xyz = 15

      console.log(pqr != xyz)


      //Logical Operator - AND , OR , NOT

      //AND - && - Both Condition True Output is True

      let TotalBill = 800
      let IsMember = true

      console.log(" Discount Applicable " ,   IsMember && TotalBill >=800  )



      //OR - Any one COndition True Output is True


      let LoginStatus = true
      let netflixSUb = false

      console.log("Can user can open the Netlfix and use " , LoginStatus || netflixSUb)

      console.log("Can Watch Movie " , LoginStatus && netflixSUb)






      //NOT - ! opp Value

      let Subscription = false
      console.log(!Subscription)



     </script>   
</body>
